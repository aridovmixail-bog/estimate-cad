<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Тень тайла -->
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.8" />
    </filter>

    <!-- Свечение CAD-элементов -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.85" />
    </filter>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#fbbf24" flood-opacity="0.9" />
    </filter>

    <!-- Градиент фона: Премиальный глубокий индиго -> королевский сапфир -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#1e1b4b" />
      <stop offset="85%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Градиент золотого чертёжного инструмента (угольник/циркуль) -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Градиент неоновых стен чертежа -->
    <linearGradient id="cyanWallGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Градиент фаски карточки (глянцевый блик) -->
    <linearGradient id="borderHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.1" />
    </linearGradient>

    <!-- Паттерн архитектурной сетки CAD -->
    <pattern id="cadGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.18" />
      <circle cx="0" cy="0" r="0.8" fill="#38bdf8" fill-opacity="0.35" />
    </pattern>
  </defs>

  <!-- 1. ОСНОВНОЙ СКРУГЛЕННЫЙ ТАЙЛ С ТЕНЬЮ -->
  <g filter="url(#tileShadow)">
    <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)" />
    <!-- Внутренняя архитектурная сетка CAD -->
    <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#cadGrid)" />
    <!-- Тонкая светящаяся фаска -->
    <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" fill="none" stroke="url(#borderHighlight)" stroke-width="1.5" />
  </g>

  <!-- 2. СТИЛИЗОВАННЫЙ ОБМЕРНЫЙ ПЛАН (НЕСУЩИЕ СТЕНЫ CAD) -->
  <g filter="url(#neonGlow)">
    <!-- Внешний контур помещения L-образной формы -->
    <path d="M 28 32
             L 76 32
             L 76 60
             L 100 60
             L 100 100
             L 28 100
             Z"
          fill="#0284c7"
          fill-opacity="0.18"
          stroke="url(#cyanWallGrad)"
          stroke-width="5"
          stroke-linejoin="round"
          stroke-linecap="round" />

    <!-- Внутренняя перегородка с дверным проёмом -->
    <path d="M 28 66 L 56 66" stroke="url(#cyanWallGrad)" stroke-width="4" stroke-linecap="round" />
    <!-- Чертёжная дуга открывания двери (CAD) -->
    <path d="M 56 66 A 14 14 0 0 1 70 80" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,2" />
    <line x1="56" y1="66" x2="56" y2="80" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

    <!-- Оконный проем на верхней стене -->
    <rect x="42" y="30" width="20" height="4" fill="#ffffff" rx="1" />
  </g>

  <!-- 3. ЗОЛОТАЯ РАЗМЕРНАЯ ЛИНИЯ И ЗАСЕЧКИ (СИМВОЛ СМЕТНОГО ОБМЕРА) -->
  <g filter="url(#goldGlow)">
    <!-- Верхняя размерная линия с засечками 45 градусов -->
    <line x1="26" y1="23" x2="78" y2="23" stroke="url(#goldGrad)" stroke-width="2" />
    <!-- Левая засечка -->
    <line x1="23" y1="26" x2="29" y2="20" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Правая засечка -->
    <line x1="75" y1="26" x2="81" y2="20" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Золотая буква "E" / Знак точности CAD в центре -->
    <!-- Архитектурный чертёжный треугольник / циркуль в правом верхнем углу -->
    <polygon points="82,24 104,46 76,46" fill="url(#goldGrad)" opacity="0.95" />
    <circle cx="87" cy="38" r="3.5" fill="#0f172a" />
  </g>

  <!-- 4. ИЗЯЩНАЯ ЧЕРТЁЖНАЯ ПРИВЯЗКА (СВЕТЯЩИЙСЯ КУРСОР ТОЧКИ CAD) -->
  <circle cx="100" cy="100" r="4.5" fill="#ffffff" filter="url(#neonGlow)" />
  <circle cx="100" cy="100" r="2" fill="#0284c7" />

  <circle cx="28" cy="32" r="3.5" fill="#38bdf8" />
  <circle cx="76" cy="32" r="3.5" fill="#38bdf8" />
  <circle cx="100" cy="60" r="3.5" fill="#38bdf8" />
</svg>